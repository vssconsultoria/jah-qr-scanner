<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Leitor NFC-e | VSS Consultoria</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 18px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f4f6f8;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: #b00020;
      background: #fff1f2 !important;
    }

    .success {
      color: #137333;
      background: #e9f7ee !important;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #263238;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .brand {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Leitor de NFC-e</h1>

    <div class="subtitle">
      Aponte a câmera para o QR Code da nota fiscal
    </div>

    <div id="reader"></div>

    <div id="status">
      Preparando câmera...
    </div>

    <button type="button" onclick="voltarSemLeitura()">
      CANCELAR
    </button>

  </div>

  <div class="brand">
    VSS Consultoria • Gestão & Controle
  </div>

</div>

<script>

const APP_URL =
  'https://script.google.com/macros/s/AKfycbxfAJ1HJmdLMNB-SooZtmFVjrIYxRH7ZfQysyK4I4Cmo_9Ib5yzNONU3Q6cct6qmVm2/exec';

let leitor = null;
let processando = false;

function atualizarStatus(texto, classe = '') {

  const status = document.getElementById('status');

  status.textContent = texto;
  status.className = classe;
}


async function iniciarScanner() {

  if (typeof Html5Qrcode === 'undefined') {
    atualizarStatus(
      'Não foi possível carregar o leitor de QR Code.',
      'error'
    );
    return;
  }

  atualizarStatus('Solicitando acesso à câmera...');

  try {

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error('Nenhuma câmera encontrada.');
    }

    console.log('Câmeras encontradas:', cameras);

    // Por padrão usa a última câmera encontrada.
    // Em celulares, normalmente é a câmera traseira.
    let cameraEscolhida = cameras[cameras.length - 1];

    // Se o navegador fornecer nomes, prioriza explicitamente a traseira.
    const traseira = cameras.find(function(camera) {

      const nome = String(camera.label || '').toLowerCase();

      return (
        nome.includes('back') ||
        nome.includes('rear') ||
        nome.includes('traseira') ||
        nome.includes('environment')
      );
    });

    if (traseira) {
      cameraEscolhida = traseira;
    }

    leitor = new Html5Qrcode('reader');

    const config = {
      fps: 12,

      qrbox: function(width, height) {

        const tamanho =
          Math.floor(Math.min(width, height) * 0.72);

        return {
          width: tamanho,
          height: tamanho
        };
      },

      aspectRatio: 1
    };

    atualizarStatus('Abrindo câmera...');

    await leitor.start(
      cameraEscolhida.id,
      config,
      qrCodeLido,
      function() {
        // Ignora falhas normais enquanto procura o QR.
      }
    );

    atualizarStatus(
      'Câmera pronta. Aponte para o QR Code da NFC-e.'
    );

  } catch (erro) {

    console.error('ERRO CAMERA:', erro);

    const detalhe =
      erro && erro.message
        ? erro.message
        : String(erro);

    atualizarStatus(
      'Erro ao acessar a câmera: ' + detalhe,
      'error'
    );
  }
}


function qrCodeLido(texto) {

  if (processando) return;

  const valor =
    String(texto || '').trim();

  if (!valor) return;

  const valorMinusculo =
    valor.toLowerCase();

  if (
    !valorMinusculo.startsWith(
      'https://www.nfce.fazenda.sp.gov.br/'
    )
  ) {

    atualizarStatus(
      'QR Code encontrado, mas ele não é uma NFC-e da SEFAZ-SP.',
      'error'
    );

    return;
  }

  processando = true;

  atualizarStatus(
    'NFC-e encontrada! Retornando ao sistema...',
    'success'
  );

  const destino =
    APP_URL +
    '?nfce=' +
    encodeURIComponent(valor);

  if (leitor) {

    leitor.stop()
      .catch(function() {})
      .finally(function() {

        window.location.replace(destino);

      });

  } else {

    window.location.replace(destino);
  }
}


function voltarSemLeitura() {

  processando = true;

  if (leitor) {

    leitor.stop()
      .catch(function() {})
      .finally(function() {

        window.location.replace(APP_URL);

      });

  } else {

    window.location.replace(APP_URL);
  }
}


window.addEventListener(
  'load',
  iniciarScanner
);

</script>

</body>
</html>
