<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Leitor de Nota Fiscal | VSS Consultoria</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 18px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f4f6f8;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      color: #b00020;
      background: #fff1f2 !important;
    }

    .success {
      color: #137333;
      background: #e9f7ee !important;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #263238;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .brand {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1 id="titulo">Leitor de nota fiscal</h1>

    <div class="subtitle" id="subtitulo">
      Preparando leitor...
    </div>

    <div id="reader"></div>

    <div id="status">
      Preparando câmera...
    </div>

    <button type="button" onclick="voltarSemLeitura()">
      CANCELAR
    </button>

  </div>

  <div class="brand">
    VSS Consultoria • Gestão & Controle
  </div>

</div>

<script>

let leitor = null;
let processando = false;


/*
 * MODOS:
 *
 * ?modo=nfce
 *   Lê QR Code da NFC-e.
 *
 * ?modo=nfe
 *   Lê código de barras CODE_128 do DANFE.
 */

const parametros =
  new URLSearchParams(window.location.search);

const modo =
  parametros.get('modo') === 'nfe'
    ? 'nfe'
    : 'nfce';


function atualizarInterface() {

  const titulo =
    document.getElementById('titulo');

  const subtitulo =
    document.getElementById('subtitulo');

  if (modo === 'nfe') {

    titulo.textContent =
      'Leitor de NF-e / DANFE';

    subtitulo.textContent =
      'Aponte a câmera para o código de barras da chave de acesso do DANFE.';

  } else {

    titulo.textContent =
      'Leitor de NFC-e';

    subtitulo.textContent =
      'Aponte a câmera para o QR Code da nota fiscal.';
  }
}


function atualizarStatus(texto, classe = '') {

  const status =
    document.getElementById('status');

  status.textContent = texto;
  status.className = classe;
}


function somenteNumeros(valor) {

  return String(valor || '')
    .replace(/\D/g, '');
}


function chaveNFeValida(chave) {

  return /^\d{44}$/.test(chave);
}


async function iniciarScanner() {

  atualizarInterface();

  if (typeof Html5Qrcode === 'undefined') {

    atualizarStatus(
      'Não foi possível carregar o leitor.',
      'error'
    );

    return;
  }

  atualizarStatus(
    'Solicitando acesso à câmera...'
  );

  try {

    const cameras =
      await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error(
        'Nenhuma câmera encontrada.'
      );
    }

    let cameraEscolhida =
      cameras[cameras.length - 1];

    const traseira =
      cameras.find(function(camera) {

        const nome =
          String(camera.label || '')
            .toLowerCase();

        return (
          nome.includes('back') ||
          nome.includes('rear') ||
          nome.includes('traseira') ||
          nome.includes('environment')
        );
      });

    if (traseira) {
      cameraEscolhida = traseira;
    }

    leitor =
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:
            modo === 'nfe'
              ? [Html5QrcodeSupportedFormats.CODE_128]
              : [Html5QrcodeSupportedFormats.QR_CODE]
        }
      );


    let config;

    if (modo === 'nfe') {

      config = {
        fps: 15,

        qrbox: function(width, height) {

          return {
            width:
              Math.floor(width * 0.90),

            height:
              Math.floor(
                Math.min(height * 0.32, 180)
              )
          };
        },

        aspectRatio: 1.777778
      };

    } else {

      config = {
        fps: 12,

        qrbox: function(width, height) {

          const tamanho =
            Math.floor(
              Math.min(width, height) * 0.72
            );

          return {
            width: tamanho,
            height: tamanho
          };
        },

        aspectRatio: 1
      };
    }


    atualizarStatus(
      'Abrindo câmera...'
    );


    await leitor.start(
      cameraEscolhida.id,
      config,
      codigoLido,
      function() {
        // Falhas de leitura durante a procura
        // são normais e são ignoradas.
      }
    );


    if (modo === 'nfe') {

      atualizarStatus(
        'Câmera pronta. Enquadre somente o código de barras do DANFE.'
      );

    } else {

      atualizarStatus(
        'Câmera pronta. Aponte para o QR Code da NFC-e.'
      );
    }


  } catch (erro) {

    console.error(
      'ERRO CAMERA:',
      erro
    );

    const detalhe =
      erro && erro.message
        ? erro.message
        : String(erro);

    atualizarStatus(
      'Erro ao acessar a câmera: ' +
      detalhe,
      'error'
    );
  }
}


function codigoLido(texto) {

  if (processando) return;

  const valor =
    String(texto || '').trim();

  if (!valor) return;


  /*
   * NF-e / DANFE
   */
  if (modo === 'nfe') {

    const chave =
      somenteNumeros(valor);

    if (!chaveNFeValida(chave)) {

      atualizarStatus(
        'Código encontrado, mas não contém uma chave válida de 44 dígitos.',
        'error'
      );

      return;
    }

    processando = true;

    atualizarStatus(
      'Chave da NF-e encontrada! Enviando para o sistema...',
      'success'
    );

    devolverParaJah(
      'JAH_NFE_CHAVE',
      chave
    );

    return;
  }


  /*
   * NFC-e
   */
  if (
    !valor.toLowerCase().startsWith(
      'https://www.nfce.fazenda.sp.gov.br/'
    )
  ) {

    atualizarStatus(
      'QR Code encontrado, mas ele não é uma NFC-e da SEFAZ-SP.',
      'error'
    );

    return;
  }


  processando = true;

  atualizarStatus(
    'NFC-e encontrada! Enviando para o sistema...',
    'success'
  );

  devolverParaJah(
    'JAH_NFCE_QR',
    valor
  );
}


function devolverParaJah(tipo, valor) {

  function devolver() {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          tipo: tipo,
          valor: valor
        },
        '*'
      );

      setTimeout(function() {
        window.close();
      }, 300);

      return;
    }

    atualizarStatus(
      'Não encontrei a janela do JAH. Volte ao sistema e tente novamente.',
      'error'
    );

    processando = false;
  }


  if (leitor) {

    leitor.stop()
      .catch(function() {})
      .finally(devolver);

  } else {

    devolver();
  }
}


function voltarSemLeitura() {

  processando = true;

  function fecharScanner() {

    if (
      window.opener &&
      !window.opener.closed
    ) {
      window.opener.focus();
    }

    window.close();
  }


  if (leitor) {

    leitor.stop()
      .catch(function() {})
      .finally(fecharScanner);

  } else {

    fecharScanner();
  }
}


window.addEventListener(
  'load',
  iniciarScanner
);

</script>

</body>
</html>
